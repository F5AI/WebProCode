# Production stack for one VPS: the Node app + Caddy (automatic HTTPS via Let's Encrypt).
# Run from the repository root:
#   cp .env.example .env            # fill DOMAIN, BANK_*, keep NODE_ENV out (the image sets it), set TRUST_PROXY=1
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
# --env-file .env lets every later compose command (ps, logs, restart, exec) read DOMAIN without exporting it.
# Data (SQLite + uploads) lives in the named volume f5-data; Caddy certificates in caddy-data.
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      TRUST_PROXY: "1"
      APP_ORIGIN: "https://${DOMAIN:?Set DOMAIN=your.domain}"
      DATABASE_PATH: /app/.data/club.sqlite
    volumes:
      - f5-data:/app/.data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN=your.domain}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  f5-data:
  caddy-data:
  caddy-config:
